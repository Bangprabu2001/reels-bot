name: Buat dan render video

on:
  workflow_dispatch:
    inputs:
      topik:
        description: "Topik video (kosongkan untuk ambil dari topik.txt)"
        required: false
        default: ""
      durasi:
        description: "Durasi target (detik)"
        required: false
        default: "75"
        type: choice
        options:
          - "45"
          - "60"
          - "75"
          - "90"
          - "120"
          - "150"
          - "180"
      gaya:
        description: "Gaya video (auto = dipilih dari topik)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - STYLE_HUD_TECH
          - STYLE_PAPER_DAKWAH
          - STYLE_RETRO_NOIR
          - STYLE_CLAY_3D
      suara:
        description: "Suara narator (auto = sesuai gaya, atau nama suara Gemini TTS seperti Kore, Achird, Puck)"
        required: false
        default: "auto"

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Naskah, fakta, suara, ilustrasi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TOPIK: ${{ github.event.inputs.topik }}
          DURASI: ${{ github.event.inputs.durasi }}
          SUARA: ${{ github.event.inputs.suara }}
          GAYA: ${{ github.event.inputs.gaya }}
        run: |
          pip install -r scripts/requirements.txt
          python3 scripts/pipeline.py "$TOPIK"

      - name: Install Remotion dan dependensi
        run: |
          npm install --save-exact remotion @remotion/cli @remotion/google-fonts react react-dom
          npm install --save-dev typescript @types/react @types/react-dom
          npx remotion versions

      - name: Dependensi sistem untuk Chrome headless
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Render
        run: npx remotion render Reels out/video.mp4 --props=data/latest.json --concurrency=3 --timeout=120000

      - uses: actions/upload-artifact@v4
        with:
          name: video-siap-upload
          path: |
            out/video.mp4
            data/latest.json
            data/info-unggah.txt
