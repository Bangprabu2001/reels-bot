name: Buat dan render video

on:
  workflow_dispatch:
    inputs:
      topik:
        description: "Topik video (kosongkan untuk ambil dari topik.txt)"
        required: false
        default: ""

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Naskah, pemeriksaan fakta, suara
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIK: ${{ github.event.inputs.topik }}
        run: |
          pip install -r scripts/requirements.txt
          python3 scripts/pipeline.py "$TOPIK"

      - name: Install Remotion dan dependensi
        run: |
          npm install --save-exact remotion @remotion/cli @remotion/google-fonts react react-dom
          npm install --save-dev typescript @types/react @types/react-dom
          npx remotion versions

      - name: Dependensi sistem untuk Chrome headless
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Render
        run: npx remotion render Reels out/video.mp4 --props=data/latest.json --concurrency=2

      - uses: actions/upload-artifact@v4
        with:
          name: video-siap-upload
          path: |
            out/video.mp4
            data/latest.json
