name: Pabrik Konten

# Dinyalakan oleh Cloudflare Worker saat kamu menekan tombol di Telegram.
# Bisa juga dijalankan manual: Actions -> Pabrik Konten -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      aksi:
        description: "mode / ok / re / no / caption  (dari tombol Telegram)"
        required: true
        default: "mode"
      data:
        description: "mode: 1, 2, atau 3 (boleh 2:3 = tiga video). Tombol lain: otomatis"
        required: false
        default: "1"
      chat:
        description: "Chat ID Telegram kamu (kosongkan kalau secret TELEGRAM_CHAT_ID sudah diisi)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  kerja:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      AKSI: ${{ github.event.inputs.aksi }}
      DATA_INPUT: ${{ github.event.inputs.data }}
      CHAT_INPUT: ${{ github.event.inputs.chat }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang pustaka Python
        run: pip install -r requirements.txt

      - name: Pasang ffmpeg dan font (hanya untuk membuat video)
        if: env.AKSI == 'mode' || env.AKSI == 're' || env.AKSI == 'no'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core libraqm0 libfribidi0

      - name: Jalankan pabrik
        run: python -m src.bot --aksi "$AKSI" --data "$DATA_INPUT" --chat "$CHAT_INPUT"

      - name: Simpan data (cadangan)
        if: always()
        run: |
          git config user.name "pabrik-bot"
          git config user.email "pabrik-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "update data pabrik"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" && git push && break
              sleep $((i*4))
            done
          fi
