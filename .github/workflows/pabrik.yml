name: Pabrik Konten

on:
  schedule:
    - cron: "*/10 * * * *"   # cek pesan Telegram tiap ~10 menit (GitHub boleh telat beberapa menit)
  workflow_dispatch:
    inputs:
      mode:
        description: "Isi 1, 2, atau 3 untuk langsung bikin video. Kosongkan untuk hanya memeriksa pesan Telegram."
        required: false
        default: ""
      jumlah:
        description: "Jumlah video (maks 3)"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: pabrik
  cancel-in-progress: false

jobs:
  kerja:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      MODE_INPUT: ${{ github.event.inputs.mode }}
      JUMLAH_INPUT: ${{ github.event.inputs.jumlah }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang pustaka ringan
        run: pip install requests

      - name: Ada pesan baru dari kamu?
        id: cek
        run: python -m src.bot --cek

      - name: Pasang alat produksi video
        if: steps.cek.outputs.ada_kerja == 'true' || env.MODE_INPUT != ''
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core libraqm0 libfribidi0
          pip install -r requirements.txt

      - name: Jalankan pabrik
        if: steps.cek.outputs.ada_kerja == 'true' || env.MODE_INPUT != ''
        run: python -m src.bot --jalan --mode "$MODE_INPUT" --jumlah "$JUMLAH_INPUT"

      - name: Simpan database topik dan status
        if: always()
        run: |
          git config user.name "pabrik-bot"
          git config user.email "pabrik-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "update data pabrik"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push || true
          fi
